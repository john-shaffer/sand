# args:
#   "@" means one file can be passed as an argument here.
#   "*@" means multiple files can be passed as separate arguments here.
# args-config: Like args, but used when the config file is detected.
# bin-name: Binary to run, if different from the package's default.
# config-filenames: List of config filenames to look for.
#   These can be glob patterns, like "*.csproj".
# env: Map of env vars to set when running the formatter. Values are converted
#   to strings.
# extensions: List of file extensions this formatter works on.
# filenames: List of exact filenames this formatter works on.
# flake: A flake ref for the package, for tools that aren't in nixpkgs yet.
#   Only for reference when updating: it's never fetched, because a tag can be
#   moved. Requires bin-name and flake-lock, and excludes package.
# flake-lock: What is fetched instead of flake. A table with the type, narHash,
#   and the rest of the locked ref, like owner, repo and rev for github.
#   Get it from `nix flake metadata --json <flake>`, under "locked".
# flake-package: The package in the flake's packages.<system>. Default is
#   "default".
# package: The name of the package in nixpkgs. See https://search.nixos.org.
# parent-dirnames: List of directory names. If given, the formatter only works
#   on files whose parent directory has one of these names.
# priority: Formatters with lower priority take precedence when multiple formatters
#   match. The default is 5.
# runtime-packages: Additional packages needed at runtime.

[black]
args = ["*@"]
extensions = ["py"]
package = "black"

[cargo]
args-config = ["fmt", "--manifest-path", "{{config}}", "--", "*@"]
config-filenames = ["Cargo.toml"]
extensions = ["rs"]
package = "cargo"
priority = 3
runtime-packages = ["rustfmt"]

[clang-format]
args = ["-i", "*@"]
bin-name = "clang-format"
extensions = ["c", "cpp", "h"]
package = "clang-tools"

# Only used when a CSharpier config file is found, since dotnet format is
# the default for C#. .csharpierrc may be JSON or YAML.
[csharpier]
args-config = ["format", "--config-path", "{{config}}", "*@"]
config-filenames = [".csharpierrc", ".csharpierrc.json", ".csharpierrc.yaml"]
extensions = ["cs", "csx"]
package = "csharpier"
priority = 3

# With a project file, dotnet format runs its whitespace, style and
# analyzer fixes. Without one, it can only run the whitespace formatter,
# and only with --folder.
[dotnet-format]
args = ["format", "whitespace", "--folder", "--include", "*@"]
args-config = ["format", "{{config}}", "--include", "*@"]
bin-name = "dotnet"
config-filenames = ["*.csproj"]
# Turn off the dotnet CLI's telemetry and its first-run output. The
# nixpkgs setup hook sets these too, but sand shouldn't depend on that.
env = { DOTNET_CLI_TELEMETRY_OPTOUT = "1", DOTNET_NOLOGO = "1", DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1", DOTNET_SKIP_WORKLOAD_INTEGRITY_CHECK = "1" }
extensions = ["cs"]
package = "dotnet-sdk"

[gofmt]
args = ["-w", "*@"]
bin-name = "gofmt"
extensions = ["go"]
package = "go"

[google-java-format]
args = ["-i", "*@"]
extensions = ["java"]
package = "google-java-format"

[haxe-formatter]
args = ["-s", "*@"]
bin-name = "haxe-formatter"
extensions = ["hx"]
flake = "github:john-shaffer/haxe-formatter-flake"
flake-lock = { narHash = "sha256-q8FhX7mTzGPnlXeDRw1LocAaAn40vtlH365MzNCOwLk=", owner = "john-shaffer", repo = "haxe-formatter-flake", rev = "4c86f0039e87c8782d543caebdb0067fb43396b1", type = "github" }

[hujsonfmt]
args = ["-w", "*@"]
extensions = ["hujson"]
package = "hujsonfmt"

[jsonfmt]
args = ["-w", "*@"]
extensions = ["json"]
package = "jsonfmt"

[just]
args = ["--fmt", "--unstable", "-f", "@"]
filenames = ["justfile"]
package = "just"

[nixfmt]
args = ["*@"]
extensions = ["nix"]
package = "nixfmt"

[prettier]
args = ["--write", "--ignore-path", "/dev/null", "*@"]
extensions = ["js", "jsx", "ts", "tsx"]
package = "prettier"

# Some tools read JSON with comments and trailing commas (JSONC), even in
# files with a .json extension. jsonfmt fails on these files, so they go
# to prettier. --parser jsonc keeps comments and trailing commas. Without
# it, prettier picks a parser by filename and removes trailing commas from
# some of these files.
# - tsconfig.json and jsconfig.json are read by TypeScript.
# - devcontainer.json and .devcontainer.json are read by Dev Containers.
# - .eslintrc.json is read by ESLint, which allows JavaScript-style comments:
#   https://eslint.org/docs/v8.x/use/configure/configuration-files
# - .babelrc.json and babel.config.json are read by Babel as JSON5:
#   https://babeljs.io/docs/config-files
# - appsettings.json is read by ASP.NET Core, which allows comments in it:
#   https://learn.microsoft.com/en-us/aspnet/core/fundamentals/configuration/
# - .code-workspace files are read by VS Code.
[prettier-jsonc]
args = ["--write", "--ignore-path", "/dev/null", "--parser", "jsonc", "*@"]
bin-name = "prettier"
extensions = ["code-workspace", "jsonc"]
filenames = [
  ".babelrc.json",
  ".devcontainer.json",
  ".eslintrc.json",
  "appsettings.json",
  "babel.config.json",
  "devcontainer.json",
  "jsconfig.json",
  "tsconfig.json",
]
package = "prettier"

# Zed reads settings.json, keymap.json, etc. as JSONC. Its default
# file_types setting maps **/.zed/**/*.json, **/zed/**/*.json and
# **/Zed/**/*.json to JSONC: https://zed.dev/docs/configuring-zed
# Trailing commas are allowed, so prettier may leave them in place.
[prettier-jsonc-dirs]
args = ["--write", "--ignore-path", "/dev/null", "--parser", "jsonc", "*@"]
bin-name = "prettier"
extensions = ["json"]
package = "prettier"
parent-dirnames = [".zed", "Zed", "zed"]
priority = 3

# vicinae reads settings.json and the files it imports with a JSONC parser
# that rejects trailing commas (read_file_jsonc in
# src/server/src/config/config.cpp): https://github.com/vicinaehq/vicinae
[prettier-jsonc-no-trailing-commas-dirs]
args = [
  "--write",
  "--ignore-path",
  "/dev/null",
  "--parser",
  "jsonc",
  "--trailing-comma",
  "none",
  "*@",
]
bin-name = "prettier"
extensions = ["json"]
package = "prettier"
parent-dirnames = ["vicinae"]
priority = 2

# VS Code reads every .json file in a .vscode dir (settings.json,
# launch.json, etc.) as JSONC. This takes precedence over jsonfmt for
# those files only.
[prettier-vscode]
args = ["--write", "--ignore-path", "/dev/null", "--parser", "jsonc", "*@"]
bin-name = "prettier"
extensions = ["json"]
package = "prettier"
parent-dirnames = [".vscode"]
priority = 4

[pretty-php]
args = ["*@"]
extensions = ["php"]
package = "pretty-php"

[rustfmt]
args = ["*@"]
args-config = ["--config-path", "{{config}}", "*@"]
config-filenames = ["rustfmt.toml", ".rustfmt.toml"]
extensions = ["rs"]
package = "rustfmt"

[standard-clj]
args = ["fix", "*@"]
args-config = ["--config", "{{config}}", "fix", "*@"]
bin-name = "standard-clj"
config-filenames = [".standard-clj.edn", ".standard-clj.json"]
extensions = ["clj", "cljc", "cljs", "edn", "jank"]
flake = "github:john-shaffer/standard-clojure-style-haxe"
flake-lock = { narHash = "sha256-s8Y12zed5V+xvfuqXCTqnLbtT8AS5eHpbqoqWZhx9cU=", owner = "john-shaffer", repo = "standard-clojure-style-haxe", rev = "7ce472950cc0e1baad7d028fd667100d33eb342a", type = "github" }

[taplo]
args = ["format", "*@"]
extensions = ["toml"]
package = "taplo"
