name = "Options can come before the command or after files"

[setup.files."a.toml"]
content = """
a=1
"""

[setup.files."b.toml"]
content = """
b=2
"""

[[steps]]
run = "sand --debug format a.toml"

[steps.expected]
exit-code = 0
stdout-contains = "Running command"

[steps.expected.files."a.toml"]
content = """
a = 1
"""

[[steps]]
run = "sand format b.toml --debug"

[steps.expected]
exit-code = 0
stdout-contains = "Running command"

[steps.expected.files."b.toml"]
content = """
b = 2
"""
