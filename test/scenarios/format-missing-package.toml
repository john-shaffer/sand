name = "A package that isn't in nixpkgs is skipped with a warning"

[setup.files."a.toml"]
content = """
a=1
"""

[setup.files."b.zz"]
content = """
b
"""

[[steps]]
# a.toml is still formatted, but the exit code shows that b.zz wasn't.
run = """
mkdir data && cp "$SAND_SOURCE_DATA_DIR"/* data/ && chmod u+w data/* \
  && printf '[nopkg]\\nargs = ["*@"]\\nextensions = ["zz"]\\npackage = "no-such-package-xyz"\\n' >> data/formatters.toml \
  && git init -q . && git add a.toml b.zz \
  && SAND_DATA_DIR="$PWD/data" sand format b.zz a.toml
"""

[steps.expected]
exit-code = 1
stderr-contains = "sand: warning: package 'no-such-package-xyz' isn't in"
stderr-not-contains = "command not found"

[steps.expected.files.".sand/sand.json"]
not-contains = "no-such-package"

[steps.expected.files."a.toml"]
content = """
a = 1
"""

[steps.expected.files."b.zz"]
content = """
b
"""
