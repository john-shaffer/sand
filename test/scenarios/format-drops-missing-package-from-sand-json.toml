name = "A package in sand.json that is no longer in nixpkgs is dropped with a warning"

[setup.files.".sand/sand.json"]
content = """
{"shellPkgs": ["no-such-package-xyz"]}
"""

[setup.files."a.toml"]
content = """
a=1
"""

[[steps]]
run = "git init -q . && git add a.toml && sand format a.toml"

[steps.expected]
exit-code = 0
stderr-contains = "sand: warning: package 'no-such-package-xyz' isn't in"

[steps.expected.files.".sand/sand.json"]
contains = "taplo"
not-contains = "no-such-package"

[steps.expected.files."a.toml"]
content = """
a = 1
"""
