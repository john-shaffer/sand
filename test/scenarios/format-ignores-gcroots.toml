name = "Machine-specific files in .sand are ignored by git"

[setup.files."a.toml"]
content = """
a=1
"""

[[steps]]
run = "git init -q . && git add a.toml && sand format a.toml"

[steps.expected]
exit-code = 0

[steps.expected.files.".sand/.gitignore"]
content = """
/gcroots/
/sand.json.lock
/shell.nix
"""

[steps.expected.files."a.toml"]
content = """
a = 1
"""

[steps.expected.files.".sand/gcroots"]
exists = true

[[steps]]
run = "git status --porcelain --untracked-files=all"

[steps.expected]
stdout-not-contains = ["gcroots", "lock"]
