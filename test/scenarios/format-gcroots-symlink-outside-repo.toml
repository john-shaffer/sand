name = "A symlinked .sand/gcroots dir doesn't let sand change files outside the repo"

[setup.files."victim/keep"]
content = """
keep
"""

[setup.files."victim/sub/keep"]
content = """
keep
"""

[setup.files."repo/a.toml"]
content = """
a=1
"""

# A cloned repo controls what's committed in .sand, including symlinks.
# sand must refuse to use them, without deleting or writing anything
# through them.
[[steps]]
run = """
cd repo && git init -q . \
  && mkdir -p .sand/gcroots && ln -s ../../../victim .sand/gcroots/shell-env \
  && git add a.toml .sand/gcroots/shell-env
"""

[[steps]]
run = "cd repo && sand format a.toml"

[steps.expected]
exit-code = 1
stderr-matches = "sand: refusing to use .*shell-env, which is a symlink"

[[steps]]
run = "ls -A victim"

[steps.expected]
stdout = """
keep
sub
"""

[[steps]]
run = "cd repo && rm -rf .sand/gcroots && ln -s ../../victim .sand/gcroots"

[[steps]]
run = "cd repo && sand format a.toml"

[steps.expected]
exit-code = 1
stderr-matches = "sand: refusing to use .*gcroots, which is a symlink"

[[steps]]
run = "ls -A victim"

[steps.expected]
stdout = """
keep
sub
"""

[steps.expected.files."victim/keep"]
content = """
keep
"""

[steps.expected.files."victim/sub/keep"]
content = """
keep
"""
