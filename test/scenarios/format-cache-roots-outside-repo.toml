name = "Cache entries are GC roots only for runs outside a repo"

[setup.files."a.toml"]
content = """
a=1
"""

[setup.files."repo/b.toml"]
content = """
b=2
"""

[[steps]]
run = "sand format a.toml"

[steps.env]
SAND_CACHE_DIR = "${TACT_WORK_DIR}/outside-cache"

[steps.expected]
exit-code = 0

[steps.expected.files."a.toml"]
content = """
a = 1
"""

[[steps]]
run = 'find /nix/var/nix/gcroots/auto -lname "$TACT_WORK_DIR/outside-cache/*"'

[steps.expected]
stdout-matches = "."

[[steps]]
run = "cd repo && git init -q . && git add b.toml && sand format b.toml"

[steps.env]
SAND_CACHE_DIR = "${TACT_WORK_DIR}/repo-cache"

[steps.expected]
exit-code = 0

[steps.expected.files."repo/b.toml"]
content = """
b = 2
"""

[[steps]]
run = 'find /nix/var/nix/gcroots/auto -lname "$TACT_WORK_DIR/repo-cache/*"'

[steps.expected]
stdout = ""
