name = "Format Rust file with Cargo.toml"

[setup.files."Cargo.toml"]
content = """
[package]
name = "example"
version = "0.1.0"
edition = "2021"
"""

[setup.files."src/main.rs"]
content = """
async fn hello(   name: &str ) -> String {
    format!("Hello, {}",name)
}
"""

