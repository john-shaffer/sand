name = "Cache entries are store paths that reference the shell's inputs"

[env]
SAND_CACHE_DIR = "${TACT_WORK_DIR}/cache"

[setup.files."a.toml"]
content = """
a=1
"""

[[steps]]
run = "git init -q . && git add a.toml && sand format a.toml"

[steps.expected]
exit-code = 0

[steps.expected.files."a.toml"]
content = """
a = 1
"""

[[steps]]
run = 'readlink "$SAND_CACHE_DIR"/shell-env/*'

[steps.expected]
stdout-matches = "^/nix/store/"

[[steps]]
run = 'nix-store -q --references "$(readlink "$SAND_CACHE_DIR"/shell-env/*)"'

[steps.expected]
stdout-matches = "."

[[steps]]
run = 'test "$(readlink .sand/gcroots/shell-env/*)" = "$(readlink "$SAND_CACHE_DIR"/shell-env/*)"'
