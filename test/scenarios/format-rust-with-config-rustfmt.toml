name = "Format Rust file with rustfmt.toml"

[setup.files."rustfmt.toml"]
content = """
tab_spaces = 2
"""

[setup.files."main.rs"]
content = """
fn main( ) {
        println!("hello");
}
"""

[[steps]]
run = "sand format main.rs"

[steps.expected]
exit-code = 0

[steps.expected.files."main.rs"]
content = """
fn main() {
  println!("hello");
}
"""
